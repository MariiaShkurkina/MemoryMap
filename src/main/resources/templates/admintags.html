<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Админка — Теги</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body { margin:0; font-family:Roboto, sans-serif; background:#0b0f16; color:#eaf0ff; }
        header{
            display:flex; justify-content:space-between; align-items:center;
            padding:16px 22px; background:rgba(10,14,22,0.85);
            border-bottom:1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            position: sticky; top:0;
        }
        .brand{ font-weight:800; letter-spacing:0.3px; display:flex; gap:10px; align-items:center; }
        .dot{ width:10px; height:10px; border-radius:50%; background:#5eead4; box-shadow:0 0 18px rgba(94,234,212,0.35); }
        .btn{
            border:0; border-radius:14px; padding:10px 14px; font-weight:700; cursor:pointer;
            background:rgba(255,255,255,0.08); color:#eaf0ff; transition:0.2s;
        }
        .btn:hover{ background:rgba(255,255,255,0.14); }
        .btn-danger{ background:rgba(239,68,68,0.20); }
        .btn-danger:hover{ background:rgba(239,68,68,0.30); }
        .btn-primary{
            background: rgba(94,234,212,0.18);
            border: 1px solid rgba(94,234,212,0.25);
            color:#eafffb;
        }
        .btn-primary:hover{ background: rgba(94,234,212,0.26); }

        main{ padding:22px; max-width: 980px; margin:0 auto; }
        h1{ margin:0 0 12px; font-size:22px; }
        .muted{ opacity:0.75; margin-bottom: 16px; }

        .panel{
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 18px;
            padding: 16px;
            box-shadow: 0 18px 50px rgba(0,0,0,0.35);
        }

        .row{
            display:flex; gap:10px; align-items:center; flex-wrap:wrap;
            margin-bottom: 14px;
        }
        input{
            flex: 1;
            min-width: 220px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(0,0,0,0.20);
            color: #eaf0ff;
            outline: none;
        }
        input:focus{
            border-color: rgba(94,234,212,0.45);
            box-shadow: 0 0 0 3px rgba(94,234,212,0.12);
        }

        .list{ display:flex; flex-direction:column; gap:10px; margin-top: 10px; }
        .tag{
            display:flex; justify-content:space-between; align-items:center;
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(0,0,0,0.18);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .tag b{ font-size:14px; }
        .tag small{ opacity:0.7; }

        .err{ color:#ffb4b4; margin-top:12px; white-space:pre-wrap; }
    </style>
</head>

<body>

<header>
    <div class="brand">
        <span class="dot"></span>
        <span>TripsMap — Admin</span>
    </div>

    <div style="display:flex; gap:10px; align-items:center;">
        <button class="btn" onclick="goApp()">← В приложение</button>
        <button class="btn btn-danger" onclick="logout()">Выйти</button>
    </div>
</header>

<main>
    <h1>Каталог тегов</h1>
    <div class="muted">Тут можно добавлять/удалять теги. Доступ — только админ.</div>

    <div class="panel">
        <div class="row">
            <input id="tagName" placeholder="Название тега (например: food, museum, beach)"/>
            <button class="btn btn-primary" onclick="createTag()">+ Добавить</button>
        </div>

        <div id="tags" class="list"></div>
        <div id="err" class="err"></div>
    </div>
</main>

<script>
    // ===== helpers =====
    function logout(){
        localStorage.removeItem("token");
        window.location.href = "/login";
    }
    function goApp(){
        window.location.href = "/app";
    }

    function parseJwt(token){
        try{
            const payload = token.split(".")[1];
            const json = atob(payload.replace(/-/g, "+").replace(/_/g, "/"));
            return JSON.parse(json);
        }catch(e){
            return null;
        }
    }

    // ===== gate: only ADMIN =====
    const token = localStorage.getItem("token");
    if(!token){
        window.location.href = "/login";
    } else {
        const p = parseJwt(token);
        const role = p?.role ?? p?.ROLE ?? p?.authorities?.[0] ?? null;

        if(role !== "ADMIN" && role !== "ROLE_ADMIN"){
            window.location.href = "/app";
        }
    }

    async function api(url, options = {}){
        const r = await fetch(url, {
            ...options,
            headers: {
                "Authorization": "Bearer " + token,
                ...(options.headers || {})
            }
        });

        if(r.status === 401){
            localStorage.removeItem("token");
            window.location.href = "/login";
            return null;
        }
        if(!r.ok){
            const t = await r.text();
            throw new Error(t || ("HTTP " + r.status));
        }
        const ct = r.headers.get("content-type") || "";
        if(ct.includes("application/json")) return r.json();
        return null;
    }

    function escapeHtml(s){
        return String(s ?? "")
            .replaceAll("&","&amp;")
            .replaceAll("<","&lt;")
            .replaceAll(">","&gt;")
            .replaceAll('"',"&quot;")
            .replaceAll("'","&#039;");
    }

    // ===== tag actions =====
    async function loadTags(){
        document.getElementById("err").textContent = "";
        const box = document.getElementById("tags");
        box.innerHTML = "";

        const tags = await api("/api/tags");
        if(!tags) return;

        if(tags.length === 0){
            box.innerHTML = `<div class="tag"><b>Пока нет тегов</b><small>добавь первый</small></div>`;
            return;
        }

        for(const t of tags){
            const div = document.createElement("div");
            div.className = "tag";
            div.innerHTML = `
                <div>
                  <b>${escapeHtml(t.name ?? ("Tag #" + t.id))}</b>
                  <div><small>id: ${t.id}</small></div>
                </div>
                <div>
                  <button class="btn btn-danger" onclick="deleteTag(${t.id})">Удалить</button>
                </div>
            `;
            box.appendChild(div);
        }
    }

    async function createTag(){
        document.getElementById("err").textContent = "";
        const name = document.getElementById("tagName").value.trim();
        if(!name){
            document.getElementById("err").textContent = "Введите название тега.";
            return;
        }

        try{
            await api("/api/tags", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name })
            });

            document.getElementById("tagName").value = "";
            await loadTags();
        }catch(e){
            document.getElementById("err").textContent = "Ошибка создания тега: " + e.message;
        }
    }

    async function deleteTag(id){
        document.getElementById("err").textContent = "";
        try{
            await api(`/api/tags/${id}`, { method: "DELETE" });
            await loadTags();
        }catch(e){
            document.getElementById("err").textContent = "Ошибка удаления: " + e.message;
        }
    }

    loadTags().catch(e => {
        document.getElementById("err").textContent = "Ошибка загрузки: " + e.message;
    });
</script>

</body>
</html>
