<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Вход</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: Roboto, sans-serif;
            background: #f3f4f6;
            margin:0;
        }
        .navbar{
            display:flex;
            justify-content: space-between;
            align-items:center;
            padding:16px 24px;
            background:#111827;
            color:#fff;
        }
        .nav-title{ font-weight:700; }
        .login-container{
            max-width:400px;
            margin:80px auto;
            padding:30px;
            background:white;
            border-radius:10px;
            box-shadow:0 8px 15px rgba(0,0,0,0.1);
        }
        .login-container h1{
            text-align:center;
            margin-bottom:20px;
            font-weight:600;
            color:#333;
        }
        label{
            display:block;
            margin-top:15px;
            font-weight:500;
            color:#444;
        }
        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            border-radius:5px;
            border:1px solid #ccc;
            font-size:16px;
        }
        button{
            width:100%;
            padding:10px;
            margin-top:25px;
            background:#ff6600;
            border:none;
            color:white;
            border-radius:25px;
            font-size:16px;
            font-weight:500;
            cursor:pointer;
        }
        button:hover{ background:#e55d00; }
        #loginResponse{ color:red; margin-top:15px; text-align:center; }
        .register-link{ text-align:center; margin-top:20px; }
        .register-link a{ text-decoration:none; color:#ff6600; }
    </style>
</head>

<body>
<div class="navbar">
    <div class="nav-title">Travel Memory Map</div>
</div>

<div class="login-container">
    <h1>Вход</h1>

    <form id="loginForm" onsubmit="login(event)">
        <label for="email">Email:</label>
        <input type="email" id="email" required>

        <label for="password">Пароль:</label>
        <input type="password" id="password" required>

        <button type="submit">Войти</button>
        <div id="loginResponse"></div>
    </form>

    <div class="register-link">
        <p>Нет аккаунта? <a href="/registration">Зарегистрироваться</a></p>
    </div>
</div>

<script>
    // ===== JWT helpers =====

    // base64url -> base64 + padding
    function base64UrlToBase64(input){
        let s = (input || "").replace(/-/g, "+").replace(/_/g, "/");
        const pad = s.length % 4;
        if (pad === 2) s += "==";
        else if (pad === 3) s += "=";
        else if (pad !== 0) {
            // странная длина — пусть будет как есть
        }
        return s;
    }

    function parseJwt(token){
        try{
            const parts = token.split(".");
            if (parts.length < 2) return null;
            const payload = parts[1];
            const json = atob(base64UrlToBase64(payload));
            return JSON.parse(json);
        }catch(e){
            return null;
        }
    }

    function redirectByRole(token){
        const p = parseJwt(token);
        // у тебя в JWTService ты кладёшь role строкой (ADMIN/USER).
        // на всякий: поддержим разные варианты
        const role =
            p?.role ??
            p?.ROLE ??
            (Array.isArray(p?.authorities) ? p.authorities[0] : null) ??
            null;

        if (role === "ADMIN" || role === "ROLE_ADMIN") {
            window.location.href = "/admintags";
        } else {
            window.location.href = "/app";
        }
    }

    // если уже есть токен — не показываем форму входа
    const existingToken = localStorage.getItem("token");
    if (existingToken) {
        redirectByRole(existingToken);
    }

    async function login(event) {
        event.preventDefault();
        document.getElementById("loginResponse").textContent = "";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const resp = await fetch("/api/auth/login", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ email, password }) // твой LoginRequest
        });

        if (resp.ok) {
            const data = await resp.json(); // AuthResponse
            if (!data?.token) {
                document.getElementById("loginResponse").textContent = "Сервер не вернул token";
                return;
            }
            localStorage.setItem("token", data.token);
            redirectByRole(data.token);
        } else {
            // если сервер возвращает plain text или JSON — попробуем красиво
            let msg = "";
            const ct = resp.headers.get("content-type") || "";
            if (ct.includes("application/json")) {
                try {
                    const j = await resp.json();
                    msg = j.message || j.error || JSON.stringify(j);
                } catch(e) {
                    msg = "Ошибка входа";
                }
            } else {
                msg = await resp.text();
            }
            document.getElementById("loginResponse").textContent = msg || "Ошибка входа";
        }
    }
</script>
</body>
</html>
