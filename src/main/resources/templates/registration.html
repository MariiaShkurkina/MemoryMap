<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Регистрация</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body{ font-family:Roboto,sans-serif; background:#f3f4f6; margin:0; }
        .navbar{ padding:16px 24px; background:#111827; color:#fff; font-weight:700; }
        .box{ max-width:400px; margin:80px auto; padding:30px; background:#fff; border-radius:10px; box-shadow:0 8px 15px rgba(0,0,0,0.1); }
        h1{ text-align:center; margin:0 0 20px; }
        label{ display:block; margin-top:15px; font-weight:500; }
        input{ width:100%; padding:10px; margin-top:5px; border-radius:5px; border:1px solid #ccc; font-size:16px; }
        button{ width:100%; padding:10px; margin-top:25px; background:#ff6600; border:none; color:#fff; border-radius:25px; font-size:16px; font-weight:500; cursor:pointer; }
        button:hover{ background:#e55d00; }
        #resp{ color:red; margin-top:15px; text-align:center; }
        .link{ text-align:center; margin-top:20px; }
        .link a{ color:#ff6600; text-decoration:none; }
    </style>
</head>
<body>
<div class="navbar">Travel Memory Map</div>

<div class="box">
    <h1>Регистрация</h1>

    <form onsubmit="register(event)">
        <label>Email:</label>
        <input type="email" id="email" required>

        <label>Пароль:</label>
        <input type="password" id="password" required>

        <button type="submit">Создать аккаунт</button>
        <div id="resp"></div>
    </form>

    <div class="link">
        <p>Уже есть аккаунт? <a href="/login">Войти</a></p>
    </div>
</div>

<script>
    if (localStorage.getItem("token")) {
        window.location.href = "/app";
    }

    async function register(event){
        event.preventDefault();
        document.getElementById("resp").textContent = "";

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const resp = await fetch("/api/auth/register", {
            method:"POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ email, password }) // <-- твой RegisterRequest
        });

        if(resp.ok){
            const data = await resp.json();
            localStorage.setItem("token", data.token);
            window.location.href = "/app";
        } else {
            const msg = await resp.text();
            document.getElementById("resp").textContent = msg || "Ошибка регистрации";
        }
    }
</script>
</body>
</html>
