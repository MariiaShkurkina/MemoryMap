<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Воспоминание</title>

    <!-- Leaflet (мини-карта) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #0b0f16;
            color: #eaf0ff;
        }

        /* ===== topbar ===== */
        .topbar {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(10, 14, 22, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .brand {
            font-weight: 800;
            font-size: 18px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .brand .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #5eead4;
            box-shadow: 0 0 18px rgba(94,234,212,0.35);
        }
        .btn {
            border: 0;
            border-radius: 14px;
            padding: 10px 14px;
            font-weight: 700;
            cursor: pointer;
            background: rgba(255,255,255,0.08);
            color: #eaf0ff;
            transition: 0.2s;
        }
        .btn:hover { background: rgba(255,255,255,0.14); }
        .btn-danger { background: rgba(239,68,68,0.20); }
        .btn-danger:hover { background: rgba(239,68,68,0.30); }

        /* ===== layout ===== */
        .layout {
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 14px;
            padding: 14px;
            height: calc(100vh - 64px);
        }

        .panel {
            border-radius: 18px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
            min-height: 0;
        }
        .panel-header {
            padding: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .panel-header h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 900;
        }
        .panel-body {
            padding: 14px;
            overflow: auto;
            min-height: 0;
        }

        /* ===== info blocks ===== */
        .title {
            font-size: 22px;
            font-weight: 950;
            margin: 0 0 6px 0;
            line-height: 1.15;
        }
        .muted { opacity: 0.75; }
        .row { margin-top: 10px; }
        .label {
            font-size: 12px;
            opacity: 0.65;
            margin-bottom: 4px;
        }
        .value {
            font-size: 14px;
            font-weight: 650;
            line-height: 1.35;
            word-break: break-word;
        }
        .note {
            margin-top: 10px;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(0,0,0,0.16);
            line-height: 1.45;
            white-space: pre-wrap;
        }

        /* ===== tags ===== */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .tag {
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(94,234,212,0.14);
            border: 1px solid rgba(94,234,212,0.25);
            font-size: 12px;
            font-weight: 800;
            color: #bff7ee;
        }

        /* ===== mini map ===== */
        #miniMap {
            width: 100%;
            height: 220px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            margin-top: 12px;
        }

        /* ===== carousel ===== */
        .carousel {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
        }
        .viewer {
            position: relative;
            flex: 1;
            min-height: 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(0,0,0,0.22);
            display: grid;
            place-items: center;
        }
        .viewer img {
            max-width: 100%;
            max-height: calc(100vh - 64px - 14px - 14px - 70px - 70px);
            object-fit: contain;
            display: block;
        }
        .navBtn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(0,0,0,0.35);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: grid;
            place-items: center;
            backdrop-filter: blur(10px);
            transition: 0.15s;
            user-select: none;
        }
        .navBtn:hover { background: rgba(0,0,0,0.55); }
        .navLeft { left: 12px; }
        .navRight { right: 12px; }

        .counter {
            position: absolute;
            left: 12px;
            bottom: 12px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(255,255,255,0.12);
            font-weight: 900;
            font-size: 12px;
        }

        .thumbs {
            padding: 12px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }
        .thumb {
            width: 90px;
            height: 70px;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.10);
            cursor: pointer;
            background: rgba(255,255,255,0.06);
            flex: 0 0 auto;
            transition: 0.15s;
        }
        .thumb:hover { transform: translateY(-1px); }
        .thumb.active { border-color: rgba(94,234,212,0.65); }
        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .empty {
            padding: 18px;
            color: rgba(255,255,255,0.75);
        }

        @media (max-width: 980px) {
            .layout {
                grid-template-columns: 1fr;
                height: auto;
            }
            .panel { min-height: 420px; }
            .viewer img { max-height: 60vh; }
        }
    </style>
</head>

<body>

<div class="topbar">
    <div class="brand">
        <span class="dot"></span>
        <span>TripsMap</span>
    </div>

    <div style="display:flex; gap:10px; align-items:center;">
        <button class="btn" onclick="goBackToTrip()">← Назад к поездке</button>
        <button class="btn btn-danger" onclick="logout()">Выйти</button>
    </div>
</div>

<div class="layout">

    <!-- LEFT: info -->
    <div class="panel">
        <div class="panel-header">
            <h2>Информация</h2>
            <span class="muted" id="memIdLabel"></span>
        </div>

        <div class="panel-body">
            <div class="title" id="title">Загрузка…</div>
            <div class="muted" id="subtitle"></div>

            <div class="row">
                <div class="label">Адрес</div>
                <div class="value" id="address">—</div>
            </div>

            <div class="row" style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <div class="label">Широта</div>
                    <div class="value" id="lat">—</div>
                </div>
                <div>
                    <div class="label">Долгота</div>
                    <div class="value" id="lon">—</div>
                </div>
            </div>

            <div class="row">
                <div class="label">Оценка</div>
                <div class="value" id="rating">—</div>
            </div>

            <div class="row">
                <div class="label">Теги</div>
                <div class="tags" id="tags"></div>
            </div>

            <div class="row">
                <div class="label">Заметка</div>
                <div class="note" id="note">—</div>
            </div>

            <div id="miniMap"></div>
        </div>
    </div>

    <!-- RIGHT: carousel -->
    <div class="panel carousel">
        <div class="panel-header">
            <h2>Фотографии</h2>
            <span class="muted" id="photoCount"></span>
        </div>

        <div class="viewer" id="viewer">
            <button class="navBtn navLeft" id="prevBtn" onclick="prevPhoto()">‹</button>
            <img id="mainPhoto" alt="photo" />
            <button class="navBtn navRight" id="nextBtn" onclick="nextPhoto()">›</button>
            <div class="counter" id="counter"></div>
        </div>

        <div class="thumbs" id="thumbs"></div>
    </div>

</div>

<script>
    // ===== Auth =====
    const token = localStorage.getItem("token");
    if (!token) window.location.href = "/login";

    function logout(){
        localStorage.removeItem("token");
        window.location.href = "/login";
    }

    // ===== Parse ids from URL: /trips/{tripId}/memories/{memoryId} =====
    function parseIds(){
        const parts = location.pathname.split("/").filter(Boolean);
        // ["trips","3","memories","7"]
        return { tripId: Number(parts[1]), memoryId: Number(parts[3]) };
    }
    const { tripId, memoryId } = parseIds();

    function goBackToTrip(){
        window.location.href = `/trips/${tripId}`;
    }

    // ===== API helper =====
    async function apiGet(url){
        const r = await fetch(url, { headers: { "Authorization": "Bearer " + token } });
        if (r.status === 401) {
            localStorage.removeItem("token");
            window.location.href = "/login";
            return null;
        }
        if (!r.ok) throw new Error(await r.text() || ("HTTP " + r.status));
        return r.json();
    }

    function escapeHtml(s){
        return String(s ?? "")
            .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
            .replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }

    // ===== Mini map =====
    let miniMap, miniMarker;
    function initMiniMap(lat, lon){
        if (miniMap) return;
        miniMap = L.map("miniMap", { zoomControl: true, dragging: true });
        L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", { maxZoom: 19 }).addTo(miniMap);

        miniMarker = L.marker([lat, lon]).addTo(miniMap);
        miniMap.setView([lat, lon], 14);
    }

    // ===== Carousel state =====
    let photos = [];
    let index = 0;

    function getPhotoUrl(p){
        // ⚠️ ВАЖНО: проверь поле ссылки в MemoryPhotoResponse.
        // Я пробую url и photoUrl. Если у тебя иначе — поменяй тут.
        return p?.url ?? p?.photoUrl ?? null;
    }

    function renderCarousel(){
        const main = document.getElementById("mainPhoto");
        const thumbs = document.getElementById("thumbs");
        const counter = document.getElementById("counter");
        const photoCount = document.getElementById("photoCount");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");

        photoCount.textContent = photos.length ? `${photos.length} шт.` : "0 шт.";

        if (!photos.length) {
            document.getElementById("viewer").innerHTML = `<div class="empty">Фото пока нет. Добавь фотку — и она появится тут.</div>`;
            thumbs.innerHTML = "";
            return;
        }

        // main image
        const url = getPhotoUrl(photos[index]);
        main.src = url || "";
        counter.textContent = `${index + 1} / ${photos.length}`;

        // buttons
        prevBtn.style.display = photos.length > 1 ? "grid" : "none";
        nextBtn.style.display = photos.length > 1 ? "grid" : "none";

        // thumbs
        thumbs.innerHTML = "";
        photos.forEach((p, i) => {
            const t = document.createElement("div");
            t.className = "thumb" + (i === index ? " active" : "");
            const u = getPhotoUrl(p);
            t.innerHTML = `<img src="${u ?? ""}" alt="thumb">`;
            t.addEventListener("click", () => {
                index = i;
                renderCarousel();
            });
            thumbs.appendChild(t);
        });
    }

    function prevPhoto(){
        if (!photos.length) return;
        index = (index - 1 + photos.length) % photos.length;
        renderCarousel();
    }
    function nextPhoto(){
        if (!photos.length) return;
        index = (index + 1) % photos.length;
        renderCarousel();
    }

    // Keyboard navigation
    document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") prevPhoto();
        if (e.key === "ArrowRight") nextPhoto();
    });

    // ===== Load memory + tags + photos =====
    (async function init(){
        document.getElementById("memIdLabel").textContent = `#${memoryId}`;

        // 1) MEMORY
        // ⚠️ Подстрой под свой реальный эндпоинт:
        // В идеале он такой: GET /api/trips/{tripId}/memories/{memoryId}
        const mem = await apiGet(`/api/trips/${tripId}/memories/${memoryId}`);
        if (!mem) return;

        document.getElementById("title").textContent = mem.title ?? `Memory #${mem.id}`;
        document.getElementById("subtitle").textContent = mem.visitedAt ? `Посещено: ${mem.visitedAt}` : "";
        document.getElementById("address").textContent = mem.addressLabel ?? "—";
        document.getElementById("lat").textContent = (mem.lat ?? "—");
        document.getElementById("lon").textContent = (mem.lon ?? "—");
        document.getElementById("rating").textContent = (mem.rating ?? "—");
        document.getElementById("note").textContent = mem.note ?? "—";

        if (typeof mem.lat === "number" && typeof mem.lon === "number") {
            initMiniMap(mem.lat, mem.lon);
        } else {
            document.getElementById("miniMap").style.display = "none";
        }

        // 2) TAGS
        // эндпоинт у тебя был: GET /api/trips/{tripId}/memories/{memoryId}/tags
        const tags = await apiGet(`/api/trips/${tripId}/memories/${memoryId}/tags`);
        const tagsWrap = document.getElementById("tags");
        tagsWrap.innerHTML = "";
        if (tags && tags.length) {
            tags.forEach(t => {
                const el = document.createElement("div");
                el.className = "tag";
                el.textContent = t.name ?? ("tag#" + t.id);
                tagsWrap.appendChild(el);
            });
        } else {
            tagsWrap.innerHTML = `<span class="muted">нет тегов</span>`;
        }

        // 3) PHOTOS
        // эндпоинт у тебя был: GET /api/trips/{tripId}/memories/{memoryId}/photos
        photos = await apiGet(`/api/trips/${tripId}/memories/${memoryId}/photos`) || [];
        index = 0;
        renderCarousel();

    })().catch(err => {
        console.error(err);
        alert("Ошибка загрузки: " + err.message);
    });
</script>

</body>
</html>
