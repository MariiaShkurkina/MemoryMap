<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Мои поездки</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body{ font-family:Roboto,sans-serif; background:#f3f4f6; margin:0; }
        header{
            display:flex; justify-content:space-between; align-items:center;
            padding:16px 24px; background:#111827; color:#fff;
        }
        .brand{ font-weight:700; font-size:18px; display:flex; align-items:center; gap:10px; }
        .btn{
            background:#ff6600; color:#fff; border:none; padding:10px 16px;
            border-radius:20px; cursor:pointer; font-weight:500;
        }
        .btn:hover{ background:#e55d00; }

        main{ padding:24px; }
        .row{
            display:flex; align-items:center; justify-content:space-between;
            gap:12px; margin-bottom:14px;
        }
        h2{ margin:0; }

        .icon-btn{
            width:40px; height:40px;
            border:none; border-radius:12px;
            cursor:pointer;
            background:#111827;
            color:#fff;
            font-size:22px;
            line-height:40px;
            display:flex; align-items:center; justify-content:center;
            box-shadow:0 6px 14px rgba(0,0,0,0.10);
        }
        .icon-btn:hover{ opacity:0.92; }

        .carousel{
            display:flex;
            gap:14px;
            overflow-x:auto;
            padding-bottom:10px;
        }
        .card{
            flex:0 0 280px;
            background:#fff;
            border-radius:14px;
            padding:16px;
            box-shadow:0 6px 14px rgba(0,0,0,0.08);
            text-decoration:none;
            color:#111;
        }
        .title{ font-weight:700; font-size:18px; margin-bottom:6px; }
        .meta{ color:#444; margin-bottom:10px; }
        .dates{ color:#666; font-size:14px; }
        .empty{ color:#666; background:#fff; padding:14px; border-radius:12px; margin-top:10px; }

        /* ===== MODAL ===== */
        .modal-backdrop{
            position:fixed; inset:0;
            background:rgba(0,0,0,0.45);
            display:none;
            align-items:center; justify-content:center;
            padding:18px;
            z-index:9999;
        }
        .modal{
            width:min(560px, 100%);
            background:#fff;
            border-radius:16px;
            box-shadow:0 10px 30px rgba(0,0,0,0.25);
            overflow:hidden;
        }
        .modal-header{
            display:flex; align-items:center; justify-content:space-between;
            padding:14px 16px;
            background:#111827; color:#fff;
        }
        .modal-title{ font-weight:700; }
        .close-btn{
            border:none; background:transparent; color:#fff;
            font-size:22px; cursor:pointer;
        }
        .modal-body{ padding:16px; }
        .grid{
            display:grid;
            grid-template-columns: 1fr 1fr;
            gap:12px;
        }
        .field{ display:flex; flex-direction:column; gap:6px; }
        label{ font-size:13px; color:#333; font-weight:500; }
        input, textarea{
            font:inherit;
            padding:10px 12px;
            border:1px solid #d1d5db;
            border-radius:10px;
            outline:none;
            background:#fff;
        }
        input:focus, textarea:focus{ border-color:#ff6600; }
        textarea{ resize:vertical; min-height:90px; }
        .span2{ grid-column: span 2; }

        .modal-actions{
            display:flex;
            justify-content:flex-end;
            gap:10px;
            padding:14px 16px;
            border-top:1px solid #e5e7eb;
            background:#fafafa;
        }
        .btn-secondary{
            background:#e5e7eb; color:#111827;
        }
        .btn-secondary:hover{ background:#d1d5db; }
        .error{
            margin-top:10px;
            color:#b91c1c;
            background:#fee2e2;
            padding:10px 12px;
            border-radius:10px;
            display:none;
        }
        .hint{
            font-size:12px;
            color:#6b7280;
            margin-top:6px;
        }
    </style>
</head>
<body>

<header>
    <div class="brand">Travel Memory Map</div>
    <button class="btn" onclick="logout()">Выйти</button>
</header>

<main>
    <div class="row">
        <h2>Мои поездки</h2>
        <button class="icon-btn" title="Создать поездку" onclick="openCreateModal()">+</button>
    </div>

    <div id="trips" class="carousel"></div>
    <div id="msg"></div>
</main>

<!-- MODAL -->
<div id="backdrop" class="modal-backdrop" onclick="backdropClick(event)">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" onclick="event.stopPropagation()">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">Новая поездка</div>
            <button class="close-btn" aria-label="Закрыть" onclick="closeCreateModal()">×</button>
        </div>

        <div class="modal-body">
            <div class="grid">
                <div class="field span2">
                    <label for="fTitle">Название *</label>
                    <input id="fTitle" type="text" maxlength="140" placeholder="Например: Берлин 2026" />
                </div>

                <div class="field">
                    <label for="fCountry">Страна *</label>
                    <input id="fCountry" type="text" maxlength="80" placeholder="Germany" />
                </div>

                <div class="field">
                    <label for="fCity">Город *</label>
                    <input id="fCity" type="text" maxlength="80" placeholder="Berlin" />
                </div>

                <div class="field">
                    <label for="fStart">Дата начала *</label>
                    <input id="fStart" type="date" />
                </div>

                <div class="field">
                    <label for="fEnd">Дата конца *</label>
                    <input id="fEnd" type="date" />
                </div>

                <div class="field span2">
                    <label for="fDesc">Описание</label>
                    <textarea id="fDesc" placeholder="Коротко: что планируешь, что было классного и т.д."></textarea>
                    <div class="hint">Можно оставить пустым</div>
                </div>

                <div class="field span2">
                    <label for="fCover">Cover photo path</label>
                    <input id="fCover" type="text" placeholder="/uploads/cover.jpg (опционально)" />
                </div>
            </div>

            <div id="formError" class="error"></div>
        </div>

        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeCreateModal()">Отмена</button>
            <button class="btn" onclick="createTrip()">Создать</button>
        </div>
    </div>
</div>

<script>
    function logout(){
        localStorage.removeItem("token");
        window.location.href = "/login";
    }

    function escapeHtml(s){
        return (s ?? "").toString()
            .replaceAll("&","&amp;")
            .replaceAll("<","&lt;")
            .replaceAll(">","&gt;")
            .replaceAll('"',"&quot;")
            .replaceAll("'","&#039;");
    }

    function showMsg(html){
        document.getElementById("msg").innerHTML = html ?? "";
    }

    async function loadTrips(){
        const token = localStorage.getItem("token");
        if(!token){
            window.location.href = "/login";
            return;
        }

        const resp = await fetch("/api/trips", {
            headers: { "Authorization": "Bearer " + token }
        });

        if(resp.status === 401){
            localStorage.removeItem("token");
            window.location.href = "/login";
            return;
        }

        if(!resp.ok){
            showMsg(`<div class="empty">Ошибка загрузки поездок: ${resp.status}</div>`);
            return;
        }

        const trips = await resp.json();
        const box = document.getElementById("trips");
        box.innerHTML = "";

        if(!trips.length){
            showMsg(`<div class="empty">Пока нет поездок. Нажми “+”, чтобы создать первую.</div>`);
            return;
        }

        showMsg("");
        for(const t of trips){
            box.appendChild(renderTripCard(t));
        }
    }

    function renderTripCard(t){
        const a = document.createElement("a");
        a.className = "card";
        a.href = "/trips/" + t.id;

        a.innerHTML = `
      <div class="title">${escapeHtml(t.title)}</div>
      <div class="meta">${escapeHtml(t.country)} · ${escapeHtml(t.city)}</div>
      <div class="dates">${escapeHtml(t.startDate)} — ${escapeHtml(t.endDate)}</div>
    `;
        return a;
    }

    // ===== Modal logic =====
    function openCreateModal(){
        clearFormError();
        // Можно сразу подставить сегодня
        const today = new Date().toISOString().slice(0,10);
        document.getElementById("fStart").value ||= today;
        document.getElementById("fEnd").value ||= today;

        document.getElementById("backdrop").style.display = "flex";
        document.getElementById("fTitle").focus();
    }

    function closeCreateModal(){
        document.getElementById("backdrop").style.display = "none";
    }

    function backdropClick(e){
        // клик по затемнению — закрываем
        closeCreateModal();
    }

    document.addEventListener("keydown", (e) => {
        if(e.key === "Escape" && document.getElementById("backdrop").style.display === "flex"){
            closeCreateModal();
        }
    });

    function setFormError(text){
        const box = document.getElementById("formError");
        box.textContent = text;
        box.style.display = "block";
    }

    function clearFormError(){
        const box = document.getElementById("formError");
        box.textContent = "";
        box.style.display = "none";
    }

    function readCreateForm(){
        const title = document.getElementById("fTitle").value.trim();
        const country = document.getElementById("fCountry").value.trim();
        const city = document.getElementById("fCity").value.trim();
        const startDate = document.getElementById("fStart").value;
        const endDate = document.getElementById("fEnd").value;
        const description = document.getElementById("fDesc").value.trim();
        const coverPhotoPath = document.getElementById("fCover").value.trim();

        return {
            title,
            country,
            city,
            startDate,
            endDate,
            description: description || null,
            coverPhotoPath: coverPhotoPath || null
        };
    }

    function validateCreateForm(data){
        if(!data.title) return "Заполни название";
        if(!data.country) return "Заполни страну";
        if(!data.city) return "Заполни город";
        if(!data.startDate) return "Заполни дату начала";
        if(!data.endDate) return "Заполни дату конца";
        if(data.endDate < data.startDate) return "Дата конца не может быть раньше даты начала";
        return null;
    }

    async function createTrip(){
        clearFormError();

        const token = localStorage.getItem("token");
        if(!token){
            window.location.href = "/login";
            return;
        }

        const data = readCreateForm();
        const err = validateCreateForm(data);
        if(err){
            setFormError(err);
            return;
        }

        try{
            const resp = await fetch("/api/trips", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            if(resp.status === 401){
                localStorage.removeItem("token");
                window.location.href = "/login";
                return;
            }

            if(!resp.ok){
                const txt = await resp.text();
                setFormError(txt || `Ошибка создания: ${resp.status}`);
                return;
            }

            const created = await resp.json();

            // добавляем карточку сразу в начало карусели
            const box = document.getElementById("trips");
            box.prepend(renderTripCard(created));
            showMsg("");

            // закрываем модалку
            closeCreateModal();

            // (опционально) очистить форму
            document.getElementById("fTitle").value = "";
            document.getElementById("fCountry").value = "";
            document.getElementById("fCity").value = "";
            document.getElementById("fDesc").value = "";
            document.getElementById("fCover").value = "";

        }catch(e){
            setFormError("Сеть/сервер недоступен: " + e.message);
        }
    }

    loadTrips();
</script>

</body>
</html>
